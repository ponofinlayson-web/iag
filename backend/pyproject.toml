[project]
name = "iag"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "python-multipart>=0.0.9",
    "aiosqlite>=0.20",
    "greenlet>=3",
    "passlib>=1.7.4",
    "bcrypt>=4.1",
    "psycopg2-binary>=2.9.12",
    "asyncpg>=0.31.0",
    "jinja2>=3.1.6",
]
[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
