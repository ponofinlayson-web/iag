name: iag

services:
  iag-db:
    image: postgres:16-alpine
    container_name: iag-db
    environment:
      POSTGRES_USER: iag_migrate
      IAG_APP_DB_PASSWORD: ${IAG_APP_DB_PASSWORD:?set IAG_APP_DB_PASSWORD in .env}
      # ${VAR:?err} = compose refuses to start without .env -- no silent defaults
      POSTGRES_PASSWORD: ${IAG_POSTGRES_PASSWORD:?set IAG_POSTGRES_PASSWORD in .env}
      POSTGRES_DB: iag
    volumes:
      - iag_pgdata:/var/lib/postgresql/data
      - ./deploy/initdb.sh:/docker-entrypoint-initdb.d/initdb.sh:ro
      - ./deploy/initdb.sql:/opt/initdb/initdb.sql:ro
    healthcheck:
      # Contract check: accepting connections is NOT enough — initdb.sh failures
      # are swallowed by the postgres entrypoint, so assert iag_app exists too.
      test: ["CMD-SHELL", "pg_isready -U iag_migrate -d iag && psql -U iag_migrate -d iag -tAc \"SELECT 1 FROM pg_roles WHERE rolname='iag_app'\" | grep -q 1"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    logging: &logopts
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  iag-migrate:
    build: .
    container_name: iag-migrate
    command: sh -c "/app/.venv/bin/alembic upgrade head && /app/.venv/bin/python -m app.bootstrap && cp -r /app/static/. /shared-static/"
    user: root
    environment:
      IAG_DATABASE_URL: postgresql+asyncpg://iag_migrate:${IAG_POSTGRES_PASSWORD:?set IAG_POSTGRES_PASSWORD in .env}@iag-db:5432/iag
      IAG_SECRET_KEY: ${IAG_SECRET_KEY:?set IAG_SECRET_KEY in .env}
      IAG_ENV: development
      IAG_BOOTSTRAP_ADMIN_PASSWORD: ${IAG_BOOTSTRAP_ADMIN_PASSWORD:?set IAG_BOOTSTRAP_ADMIN_PASSWORD in .env}
    volumes:
      - iag_static:/shared-static
    depends_on:
      iag-db:
        condition: service_healthy
    restart: "no"
    logging: *logopts

  iag-app-1: &app
    build: .
    container_name: iag-app-1
    environment: &appenv
      IAG_DATABASE_URL: postgresql+asyncpg://iag_app:${IAG_APP_DB_PASSWORD:?set IAG_APP_DB_PASSWORD in .env}@iag-db:5432/iag
      IAG_SECRET_KEY: ${IAG_SECRET_KEY:?set IAG_SECRET_KEY in .env}
      IAG_ENV: development
      # Reminder worker knobs; ${VAR:-default} keeps bare `docker compose up`
      # working while letting .env speed up local proofs.
      IAG_REMINDER_DELAY_MINUTES: ${IAG_REMINDER_DELAY_MINUTES:-60}
      IAG_REMINDER_POLL_SECONDS: ${IAG_REMINDER_POLL_SECONDS:-60}
      IAG_REMINDER_MAX_ATTEMPTS: ${IAG_REMINDER_MAX_ATTEMPTS:-3}
      IAG_REMINDER_STUCK_MINUTES: ${IAG_REMINDER_STUCK_MINUTES:-15}
      IAG_REMINDER_BATCH_SIZE: ${IAG_REMINDER_BATCH_SIZE:-25}
      IAG_SMTP_HOST: ${IAG_SMTP_HOST:-}
      IAG_SMTP_PORT: ${IAG_SMTP_PORT:-587}
      IAG_SMTP_USER: ${IAG_SMTP_USER:-}
      IAG_SMTP_PASSWORD: ${IAG_SMTP_PASSWORD:-}
      IAG_SMTP_FROM: ${IAG_SMTP_FROM:-}
    depends_on:
      iag-db:
        condition: service_healthy
      iag-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "/app/.venv/bin/python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped
    logging: *logopts

  iag-app-2:
    <<: *app
    container_name: iag-app-2

  iag-app-3:
    <<: *app
    container_name: iag-app-3

  iag-nginx:
    image: nginx:alpine
    container_name: iag-nginx
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - iag_static:/usr/share/nginx/html:ro
    ports:
      - "8090:80"
    depends_on:
      iag-app-1:
        condition: service_healthy
      iag-app-2:
        condition: service_healthy
      iag-app-3:
        condition: service_healthy
    restart: unless-stopped
    logging: *logopts

  iag-glauth:
    # optional LDAP directory for live connector proofs — compose profile
    # "connectors"; never started by the default stack.
    image: glauth/glauth:latest
    container_name: iag-glauth
    profiles: ["connectors"]
    volumes:
      - ./deploy/glauth.cfg:/app/config/config.cfg:ro
    restart: unless-stopped
    logging: *logopts

volumes:
  iag_pgdata:
  iag_static:
