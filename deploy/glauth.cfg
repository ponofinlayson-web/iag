# glauth config for the IAG LDAP live-connector proof (compose profile
# "connectors"). Passwords are throwaway proof credentials.
# users live at  cn=<name>,ou=<primarygroup>,dc=glauth,dc=com
# groups live at cn=<name>,ou=groups,dc=glauth,dc=com
debug = true

[ldap]
  enabled = true
  listen = "0.0.0.0:3893"

[ldaps]
  enabled = false

[backend]
  datastore = "config"
  baseDN = "dc=glauth,dc=com"

[behaviors]
  IgnoreCapabilities = false
  LimitFailedBinds = true
  NumberOfFailedBinds = 5
  PeriodOfFailedBinds = 10
  BlockFailedBindsFor = 30
  PruneSourceTableEvery = 600
  PruneSourcesOlderThan = 600

# bind account used by the IAG connector (global search capability)
