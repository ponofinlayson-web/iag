  name = "svc-iag"
  uidnumber = 6001
  primarygroup = 5502
  mail = "svc-iag@example.com"
  passsha256 = "9254463dd830512e1f8499c6e15a09610cdb28818904d704886b0f808c304adb" # iag-ldap-proof-svc
    [[users.capabilities]]
    action = "search"
    object = "*"

