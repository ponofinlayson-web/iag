upstream iag_apps {
    least_conn;
    server iag-app-1:8000 max_fails=3 fail_timeout=10s;
    server iag-app-2:8000 max_fails=3 fail_timeout=10s;
    server iag-app-3:8000 max_fails=3 fail_timeout=10s;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    # Static SPA served directly by nginx (arch contract: no app hop).
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # Hashed assets are immutable; cache hard.
    location /assets/ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # API: load-balance to the 3 stateless replicas.
    location /api/ {
        proxy_pass http://iag_apps;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
    }

    # Container healthcheck goes to one live replica, exempt from the
    # failover counters so a dead backend doesn't skew max_fails.
    location = /api/health {
        proxy_pass http://iag_apps;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}
